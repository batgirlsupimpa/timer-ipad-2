<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ric &lt;3 bibi</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffc7df;
font-family:Arial;
}

#bg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

#timer{
position:absolute;
top:34%;
left:0;
width:100%;
text-align:center;
font-size:18vw;
font-weight:bold;
color:#e63e7d;
text-shadow:3px 3px #fff;
z-index:3;
}

#controls{
position:absolute;
bottom:15px;
left:0;
width:100%;
text-align:center;
z-index:5;
}

button{
font-size:13px;
padding:8px;
margin:2px;
border:2px solid #ed6c9c;
border-radius:10px;
background:#fff;
color:#d93672;
font-weight:bold;
}

#exit{
display:none;
position:absolute;
top:5px;
right:5px;
z-index:10;
}

.full #controls{
display:none;
}

.full #timer{
top:38%;
font-size:23vw;
}

.full #exit{
display:block;
}
</style>
</head>

<body>

<img id="bg" src="fundo.png">

<div id="timer">00:00</div>

<div id="controls">
<button onclick="startTimer()">♥ INICIAR</button>
<button onclick="pauseTimer()">♡ PAUSAR</button>
<button onclick="resumeTimer()">♥ RETOMAR</button>
<button onclick="restartTimer()">↻ RESTART</button>
<button onclick="fullScreen()">⛶</button>
</div>

<button id="exit" onclick="fullScreen()">⛶</button>

<script>

var seconds=0;
var running=false;
var timerID=null;

function draw(){
var m=Math.floor(seconds/60);
var s=seconds%60;

if(m<10){m="0"+m;}
if(s<10){s="0"+s;}

document.getElementById("timer").innerHTML=m+":"+s;
}

function tick(){
seconds=seconds+1;
draw();
}

function startTimer(){
if(running==false){
seconds=0;
draw();
timerID=setInterval(tick,1000);
running=true;
}
}

function pauseTimer(){
if(running==true){
clearInterval(timerID);
timerID=null;
running=false;
}
}

function resumeTimer(){
if(running==false){
timerID=setInterval(tick,1000);
running=true;
}
}

function restartTimer(){
if(timerID!=null){
clearInterval(timerID);
}
timerID=null;
running=false;
seconds=0;
draw();
}

function fullScreen(){
if(document.body.className=="full"){
document.body.className="";
}else{
document.body.className="full";
}
}

draw();

</script>

</body>
</html>
