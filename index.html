<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ric <3 bibi</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffd6e7;
    font-family: Arial, Helvetica, sans-serif;
}

/* FUNDO */
#background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("fundo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
}

/* ÁREA DO TIMER */
#timerArea {
    position: absolute;
    top: 22%;
    left: 10%;
    width: 80%;
    text-align: center;
    z-index: 2;
}

/* FRASE */
#love {
    font-size: 42px;
    font-weight: bold;
    color: #d93672;
    text-shadow: 2px 2px white;
    margin-bottom: 20px;
}

/* TIMER */
#timer {
    font-size: 18vw;
    font-weight: bold;
    color: #d93672;
    text-shadow:
        3px 3px white,
        -2px -2px white;
}

/* BOTÕES */
#controls {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
}

button {
    background: rgba(255,255,255,0.88);
    color: #d93672;
    border: 2px solid #f06b9b;
    border-radius: 15px;
    padding: 10px 13px;
    margin: 3px;
    font-size: 14px;
    font-weight: bold;
}

button:active {
    background: #f58bb2;
    color: white;
}

/* MODO TELA CHEIA */
.fullscreen #controls {
    display: none;
}

.fullscreen #timerArea {
    top: 32%;
}

.fullscreen #timer {
    font-size: 25vw;
}

.fullscreen #love {
    font-size: 50px;
}

#exitFull {
    display: none;
}

.fullscreen #exitFull {
    display: block;
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    background: rgba(255,255,255,0.7);
    border: none;
    color: #d93672;
    font-size: 22px;
}

/* IPAD PEQUENO */
@media screen and (max-width: 700px) {

    #timerArea {
        top: 25%;
    }

    #love {
        font-size: 30px;
    }

    #timer {
        font-size: 22vw;
    }

    button {
        font-size: 11px;
        padding: 7px 8px;
    }

}

</style>
</head>

<body>

<div id="background"></div>

<div id="timerArea">

    <div id="love">
        ric &lt;3 bibi
    </div>

    <div id="timer">
        00:00
    </div>

</div>

<div id="controls">

    <button onclick="startTimer();">
        ♥ INICIAR
    </button>

    <button onclick="pauseTimer();">
        ♡ PAUSAR
    </button>

    <button onclick="resumeTimer();">
        ♥ RETOMAR
    </button>

    <button onclick="restartTimer();">
        ↻ RESTART
    </button>

    <button onclick="fullScreen();">
        ⛶ TELA INTEIRA
    </button>

</div>

<button id="exitFull" onclick="fullScreen();">
    ⛶
</button>

<script>

var seconds = 0;
var timerRunning = false;
var timerID = null;

function showTime() {

    var minutes = Math.floor(seconds / 60);
    var secs = seconds % 60;

    if (minutes < 10) {
        minutes = "0" + minutes;
    }

    if (secs < 10) {
        secs = "0" + secs;
    }

    document.getElementById("timer").innerHTML =
        minutes + ":" + secs;
}

function count() {

    seconds = seconds + 1;

    showTime();
}

function startTimer() {

    if (timerRunning == false) {

        seconds = 0;

        showTime();

        timerID = window.setInterval(count, 1000);

        timerRunning = true;
    }
}

function pauseTimer() {

    if (timerRunning == true) {

        window.clearInterval(timerID);

        timerID = null;

        timerRunning = false;
    }
}

function resumeTimer() {

    if (timerRunning == false) {

        timerID = window.setInterval(count, 1000);

        timerRunning = true;
    }
}

function restartTimer() {

    if (timerID != null) {
        window.clearInterval(timerID);
    }

    timerID = null;

    timerRunning = false;

    seconds = 0;

    showTime();
}

function fullScreen() {

    if (document.body.className == "fullscreen") {

        document.body.className = "";

    } else {

        document.body.className = "fullscreen";
    }
}

showTime();

</script>

</body>
</html>
