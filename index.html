<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style type="text/css">

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

#timer {
    width: 100%;
    text-align: center;
    font-size: 22vw;
    font-weight: normal;
    margin-top: 18%;
    line-height: 1;
}

#controls {
    position: absolute;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
}

.btn {
    background: transparent;
    color: #ffffff;
    border: 1px solid #555555;
    border-radius: 6px;
    font-size: 15px;
    padding: 7px 10px;
    margin: 3px;
}

.btn:active {
    background: #333333;
}

</style>
</head>

<body>

<div id="timer">00:00</div>

<div id="controls">

    <button class="btn" onclick="startTimer();">
        ▶
    </button>

    <button class="btn" onclick="pauseTimer();">
        ⏸
    </button>

    <button class="btn" onclick="resumeTimer();">
        ▶
    </button>

    <button class="btn" onclick="restartTimer();">
        ↻
    </button>

    <button class="btn" onclick="fullScreen();">
        ⛶
    </button>

</div>

<script type="text/javascript">

var seconds = 0;
var timerRunning = false;
var timerID = null;

function showTime() {

    var minutes;
    var secs;

    minutes = Math.floor(seconds / 60);
    secs = seconds % 60;

    if (minutes < 10) {
        minutes = "0" + minutes;
    }

    if (secs < 10) {
        secs = "0" + secs;
    }

    document.getElementById("timer").innerHTML =
        minutes + ":" + secs;
}


function count() {

    seconds = seconds + 1;

    showTime();

}


function startTimer() {

    if (timerRunning == false) {

        seconds = 0;

        showTime();

        timerID = window.setInterval(count, 1000);

        timerRunning = true;
    }

}


function pauseTimer() {

    if (timerRunning == true) {

        window.clearInterval(timerID);

        timerID = null;

        timerRunning = false;
    }

}


function resumeTimer() {

    if (timerRunning == false) {

        timerID = window.setInterval(count, 1000);

        timerRunning = true;
    }

}


function restartTimer() {

    if (timerID != null) {

        window.clearInterval(timerID);
    }

    timerID = null;

    timerRunning = false;

    seconds = 0;

    showTime();

}


function fullScreen() {

    var element = document.documentElement;

    if (element.requestFullscreen) {

        element.requestFullscreen();

    } else if (element.webkitRequestFullscreen) {

        element.webkitRequestFullscreen();

    } else if (element.mozRequestFullScreen) {

        element.mozRequestFullScreen();

    } else if (element.msRequestFullscreen) {

        element.msRequestFullscreen();

    }

}


showTime();

</script>

</body>
</html>
